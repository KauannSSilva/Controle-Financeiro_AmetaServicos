# Site + repasse da API no mesmo endereço (os cookies SameSite=Strict funcionam sem CORS)
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 200k;

  # Só os métodos que a API usa (TRACE e outros: 405)
  if ($request_method !~ ^(GET|HEAD|POST|PATCH|DELETE|OPTIONS)$) { return 405; }

  # Arquivos ocultos (.env, .git...) nunca são servidos
  location ~ /\. { return 404; }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_hide_header X-Powered-By;
  }

  location /assets/ {
    include /etc/nginx/conf.d/cabecalhos.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/conf.d/cabecalhos.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
