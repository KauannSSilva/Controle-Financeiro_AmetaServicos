# Roda em todo push e PR: tipos, testes (com o banco), inventário de rotas, npm audit e gitleaks
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ameta
          POSTGRES_PASSWORD: senha-so-do-ci
          POSTGRES_DB: ameta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ameta" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://ameta:senha-so-do-ci@localhost:5432/ameta?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run site:build
      - name: Dependências sem vulnerabilidades conhecidas
        run: npm audit --audit-level=moderate

  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (código e todo o histórico)
        run: |
          docker run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --log-opts=--all
